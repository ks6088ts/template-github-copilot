# actionlint configuration
#
# gh-aw (github/gh-aw) compiles agentic workflows (`*.md`) into generated
# `*.lock.yml` workflows. Those files are already validated by gh-aw itself
# (`gh aw lint`) and contain gh-aw-specific constructs that plain actionlint
# does not recognize yet. For example, gh-aw emits `queue: max` under
# `concurrency` to opt into GitHub Actions concurrency *queuing*, which
# actionlint reports as a false positive ("unexpected key ... for concurrency
# section").
#
# Rather than tracking every individual false positive, ignore the whole
# generated lock-file pattern so real errors in the hand-written source
# workflows are still reported.
#
# Upstream tracking issue: https://github.com/rhysd/actionlint/issues/687
paths:
  "**/*.lock.yml":
    # `ignore` filters errors by matching their message against these regular
    # expressions. `.*` matches every message, so all errors on generated lock
    # files are ignored.
    ignore:
      - ".*"
